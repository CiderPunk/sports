[package]
name = "sports"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0" }
bevy_asset_loader = "0.27.0"
bevy_enhanced_input = "0.26.0"
bevy_pbr = "0.19.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
