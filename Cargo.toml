[package]
name = "sports"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1" }
bevy_asset_loader = "0.27.0"
bevy_enhanced_input = "0.26.0"
bevy_pbr = "0.19.1"

rand_core = "0.10"
bevy_rand = "0.15"
bevy_prng = { version = "0.15", features = ["chacha20", "wyrand"] }
rand = "0.10.0"

strum = "0.28"
strum_macros = "0.28"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"


[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
bevy_rand = { version = "0.15", features = ["wasm_js"] }
# Add the line below to make v0.3.4 getrandom work in Web WASM builds
getrandom_03 = { version = "0.3.4", features = ["wasm_js"], package = "getrandom" }
